name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["prototype/**", "engine/**", "scripts/build_app.R", "scripts/export_site.R", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install packages
        # install.packages() only warns when a package fails, so check afterwards and stop with the names of the missing ones
        run: |
          Rscript -e 'pk <- c("shiny", "bslib", "shinylive", "lme4", "emmeans", "multcomp", "multcompView", "nlme", "metan", "agricolae", "ggplot2", "svglite", "readxl", "writexl", "jsonlite", "htmltools")
            install.packages(pk)
            miss <- pk[!vapply(pk, requireNamespace, NA, quietly = TRUE)]
            if (length(miss)) stop("packages not installed: ", paste(miss, collapse = ", "))'
      - name: Copy engine into the app
        run: Rscript scripts/build_app.R
        env:
          PBTOOL_APP_VERSION: 0.9.${{ github.run_number }}
      - name: Test the app (deploy stops if a test fails)
        run: Rscript prototype/tests/test_server.R
      - name: Export Shinylive site
        run: Rscript scripts/export_site.R _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # the bundle is about 130 MB; Pages sometimes needs more than the default 10 minutes to take it (run #4 timed out)
          timeout: 1800000
